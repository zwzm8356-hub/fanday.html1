<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حجز كراسي الاتوبيس</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6a7380;--free:#d7e8ff;--freeb:#7aa7e6;--taken:#c9ccd1;--mine:#1f9d55;--line:#e2e5ea;--acc:#1f4e78}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14171b;--card:#1d2127;--tx:#eceff3;--mut:#9aa4b2;--free:#26405f;--freeb:#4f7fc0;--taken:#3a3f47;--mine:#2bb673;--line:#2d333b;--acc:#7fb2e8}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14171b;--card:#1d2127;--tx:#eceff3;--mut:#9aa4b2;--free:#26405f;--freeb:#4f7fc0;--taken:#3a3f47;--mine:#2bb673;--line:#2d333b;--acc:#7fb2e8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:4px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{flex:0 0 auto;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:14px;font-family:inherit;cursor:pointer;text-align:center}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tab small{display:block;font-size:11px;opacity:.85}
.bus{display:flex;flex-direction:column;gap:8px;align-items:center;padding:10px 0}
.front{width:100%;text-align:center;font-size:12px;color:var(--mut);border-bottom:2px dashed var(--line);padding-bottom:6px}
.r{display:flex;gap:6px;align-items:center;justify-content:center}
.aisle{width:26px}
.s{width:44px;height:44px;border-radius:9px 9px 5px 5px;border:2px solid var(--freeb);background:var(--free);color:var(--tx);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;padding:0}
.s.t{background:var(--taken);border-color:var(--taken);color:var(--mut);cursor:not-allowed}
.s.m{background:var(--mine);border-color:var(--mine);color:#fff}
.leg{display:flex;gap:12px;justify-content:center;font-size:12px;color:var(--mut);flex-wrap:wrap}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:4px;vertical-align:middle}
#msg{min-height:22px;font-size:14px;margin:6px 0;text-align:center}
.me{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
button.b{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-family:inherit;cursor:pointer}
.sum{font-size:13px;color:var(--mut);text-align:center}
.fr{display:grid;grid-template-columns:1fr 34px;gap:6px;margin-top:8px}
.sg{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:4px;overflow:hidden}
.sg div{padding:9px 10px;cursor:pointer;border-top:1px solid var(--line);font-size:14px}.sg div:first-child{border-top:0}
.hd{text-align:center;font-size:14px;font-weight:700;margin-bottom:4px}
.bk{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.s.z{opacity:.4;border-style:dashed;background:var(--taken);border-color:var(--mut);color:var(--mut);cursor:not-allowed}
</style>
</head>
<body>
<div class="wrap">
<h1>🚌 حجز كراسي الاتوبيس</h1>
<div id="status" class="card">جاري التحميل...</div>
<div id="ok" class="card" hidden style="border-color:var(--mine)"></div>
<div id="form" hidden>
 <div class="card">

  <div class="sg" id="sgm" hidden></div><div class="sum" id="inm"></div>
  <div id="frs"></div>

 </div>

 <div class="card" id="bk" hidden></div>
</div>
<div class="tabs" id="tabs"></div>
<div id="msg"></div>
<div class="card" id="mapcard" hidden>

  <div class="bus" id="bus"></div>
  <div class="sum" id="sum"></div>
</div>
<div class="card" id="alog" hidden>
  <div class="hd">دخول الأدمن</div>
  <input id="ae" type="email" placeholder="الإيميل" style="direction:ltr;margin-bottom:6px"><input id="ap" type="password" placeholder="الباسورد" style="direction:ltr">
  <button class="b" id="ab" style="margin-top:8px">دخول</button>
</div>
<div class="card" id="adm" hidden></div>
<div class="card" id="cfgc" hidden><div class="hd">إعدادات التوزيع (الأدمن)</div>

 <button class="b" id="cA" style="margin-top:8px">تطبيق</button><div class="sum" id="cS" style="margin-top:8px;text-align:right"></div></div>
</div>

function say(t,bad){const m=$('msg');m.textContent=t||'';m.style.color=bad?'#d64545':'var(--mine)';}
function zone(b,n){let a=0;for(const [d,q] of Object.entries(QUOTA[b]||{})){a+=q;if(n<=a)return d;}return 'احتياطي';}
function rangeOf(v){const q=String(v.seats).split('-').map(Number);return q.length>1?[q[0],q[1]]:[q[0],q[0]];}

// ---------- حساب التوزيع من أعداد القايمة ----------
function buildConfig(N,C,P){
 N=Math.max(2,Math.floor(N)||6);C=Math.max(4,Math.floor(C)||49);P=Math.min(95,Math.max(51,+P||70));CFG={N:N,C:C,P:P};
 const seen=new Set(),D0=DEPTS.map(n=>({name:n,T:0}));
 RI.forEach(r=>{if(seen.has(r.k))return;seen.add(r.k);const d=D0.find(x=>x.name===r.dept);if(d)d.T+=1+r.comp;});
 const D=D0.filter(d=>d.T>0),M=Math.round(C*P/100),mb=N-1,mx=N-1;
 const k=D.map(d=>Math.floor(d.T/M)),rem=D.map((d,i)=>d.T/M-k[i]);
 let s=k.reduce((a,b)=>a+b,0);
 for(const i of D.map((_,i)=>i).sort((a,b)=>rem[b]-rem[a])){if(s>=mb)break;k[i]++;s++;}
 while(s>mb){const c=D.map((_,i)=>i).filter(i=>k[i]>0).sort((a,b)=>rem[a]-rem[b])[0];k[c]--;s--;}
 const md=[];D.forEach((d,i)=>{for(let j=0;j<k[i];j++)md.push(i);});
 const Qa=Array.from({length:N},()=>({})),R=D.map(d=>d.T);
 D.forEach((d,i)=>{if(!k[i])return;let j=0;md.forEach((di,b)=>{if(di!==i)return;const v=Math.min(M,Math.floor(d.T/k[i])+(j<d.T%k[i]?1:0));j++;Qa[b][d.name]=v;R[i]-=v;});});
 const share=Math.floor(C/D.length);
 D.forEach((d,i)=>{const m=Math.min(R[i],share);if(m>0){Qa[mx][d.name]=m;R[i]-=m;}});
 const free=b=>C-Object.values(Qa[b]).reduce((a,x)=>a+x,0);
 for(const i of D.map((_,i)=>i).sort((a,b)=>R[b]-R[a])){
  while(R[i]>0){let best=-1,bf=0;
   for(let b=0;b<mb;b++){if(md[b]===i)continue;const f=free(b);if(f>bf){bf=f;best=b;}}
   if(best<0){bf=free(mx);if(bf>0)best=mx;}
   if(best<0)break;
   const x=Math.min(R[i],bf);Qa[best][D[i].name]=(Qa[best][D[i].name]||0)+x;R[i]-=x;}
 }
 QUOTA={};MAJ={};OPEN={};CAP=C;MIXED=N;CFG.lost=R.reduce((x,y)=>x+Math.max(0,y),0);
 Qa.forEach((q,b)=>{const e=Object.entries(q).filter(([,v])=>v>0).sort((x,y)=>y[1]-x[1]);QUOTA[b+1]=Object.fromEntries(e);if(b<mb&&e[0]&&e[0][1]/C>=0.5)MAJ[b+1]=e[0][0];});
 D.forEach(d=>{
  const own=Object.keys(MAJ).filter(b=>MAJ[b]===d.name).map(Number),oth=[];
  for(let b=1;b<=mb;b++)if(!own.includes(b)&&QUOTA[b][d.name]>0)oth.push([b,QUOTA[b][d.name]]);
  oth.sort((x,y)=>y[1]-x[1]);const o={};
  if(own.length){o.major=own[0];if(own[1])o.over=own[1];if(oth[0])o.minor=oth[0][0];}
  else{if(oth[0])o.major=oth[0][0];if(oth[1])o.minor=oth[1][0];}
  OPEN[d.name]=o;
 });
}
function fillCfg(){
 $('cN').value=CFG.N;$('cC').value=CFG.C;$('cP').value=CFG.P;
 $('cS').innerHTML=(CFG.lost>0?'<b style="color:#d64545">⚠️ ناقص '+CFG.lost+' كرسي. زوّد عدد الاتوبيسات أو الكراسي</b><br>':'')+Object.entries(QUOTA).map(([b,q])=>'اتوبيس '+b+': '+Object.entries(q).map(([d,v])=>d+' '+v).join('، ')).join('<br>');
}

// ---------- الأشخاص والأسماء ----------
function persons(){
 const m=lookup($('nm').value),l=[{id:'me',kind:'me',name:m?m.name:'',dept:m?m.dept:'',comp:m?m.comp:0}];
 S.friends.forEach((f,i)=>{const r=lookup(f.name);l.push({id:'f'+i,kind:'friend',name:r?r.name:'',dept:r?r.dept:'',comp:r?r.comp:0});});
 return l;
}
function booked(p){return !!p.name&&S.mine.some(x=>x.id===NID(p.name));}
async function statusOf(name){
 const id=NID(name);
 if(!S.pc[id]||Date.now()-S.pc[id].t>8000){const x=await getDoc(doc(db,'people',id));S.pc[id]={t:Date.now(),v:x.exists()?x.data():null};}
 return S.pc[id].v;
}
function infoTxt(t){if(!t||!t.trim())return '';const r=lookup(t);return r?'✅ قسم '+r.dept+' · '+(r.comp?'معاك '+r.comp+' مرافق، هيتحجزلهم كراسي ورا بعض':'من غير مرافق'):'الاسم ده مش في قايمة المسجلين، اختاره من الاقتراحات';}
function attach(inp,box,info,cb){
 const upd=()=>{
  const k=NORM(inp.value);box.innerHTML='';const ex=lookup(inp.value);
  if(k.length>=2&&!ex){RI.filter(r=>r.k.includes(k)).slice(0,5).forEach(r=>{const d=document.createElement('div');d.textContent=r.name+' · '+r.dept;d.onclick=()=>{inp.value=r.name;upd();cb();};box.appendChild(d);});}
  box.hidden=!box.children.length;info.textContent=infoTxt(inp.value);
  if(ex){const v=inp.value;statusOf(ex.name).then(st=>{if(inp.value!==v||!st)return;info.textContent=infoTxt(v)+(st.owner===S.uid?' · ✅ محجوز: اتوبيس '+st.bus+' كراسي '+st.seats:' · ⚠️ حد صاحبك اسمه '+st.ownerName+' حجزلك: اتوبيس '+st.bus+' كراسي '+st.seats);}).catch(()=>{});}
  cb();
 };
 inp.oninput=upd;upd();
}
function drawFriends(){
 const box=$('frs');box.innerHTML='';
 S.friends.forEach((f,i)=>{
  const w=document.createElement('div'),r=document.createElement('div');r.className='fr';
  const a=document.createElement('input');a.placeholder='اسم الصديق (من القايمة)';a.value=f.name;a.autocomplete='off';
  const x=document.createElement('button');x.className='b';x.textContent='✕';x.onclick=()=>{S.friends.splice(i,1);drawFriends();render();};
  const sg=document.createElement('div');sg.className='sg';sg.hidden=true;const inf=document.createElement('div');inf.className='sum';
  r.append(a,x);w.append(r,sg,inf);box.appendChild(w);
  attach(a,sg,inf,()=>{f.name=a.value;drawWho();render();});
 });
 $('addf').hidden=S.friends.length>=3;
}
function drawWho(){
 const w=$('who'),cur=w.value;w.innerHTML='';
 persons().forEach(p=>{if(p.kind==='friend'&&!p.name)return;
  const o=document.createElement('option');o.value=p.id;o.textContent=(p.kind==='me'?'أنا':'صديقي')+(p.name?': '+p.name:'')+(booked(p)?' ✓ اتحجز':'');w.appendChild(o);});
 if([...w.options].some(o=>o.value===cur))w.value=cur;
}

// ---------- الاتوبيسات المتاحة ----------
function role(b,d){
 if(b===MIXED)return 'مشكل';
 const o=OPEN[d]||{};
 if(b===o.major)return QUOTA[b][d]/CAP>=0.55?'أغلبية':'الأعلى نسبة';
 if(b===o.over)return 'أغلبية (بديل)';
 return 'أقلية';
}
function occ(d){
 const o=OPEN[d]||{};if(!o.over)return;
 const c=S.occ[d];if(c&&Date.now()-c.t<10000)return;
 S.occ[d]={t:Date.now(),n:c?c.n:0};
 getDoc(doc(db,'buses','b'+o.major)).then(x=>{const m=(x.exists()&&x.data().seats)||{};S.occ[d]={t:Date.now(),n:Object.values(m).filter(v=>v.dept===d).length};render();}).catch(()=>{});
}
function allowed(d){
 const o=OPEN[d]||{},l=[];if(o.major)l.push(o.major);if(o.minor)l.push(o.minor);l.push(MIXED);
 if(o.over&&o.major&&((S.occ[d]&&S.occ[d].n)||0)>=QUOTA[o.major][d])l.splice(1,0,o.over);
 return l;
}
function watchBus(b){
 if(S.watch===b)return;
 if(S.unsub)S.unsub();S.watch=b;S.seats={};
 S.unsub=onSnapshot(doc(db,'buses','b'+b),sn=>{S.seats=(sn.exists()&&sn.data().seats)||{};render();},()=>{$('status').hidden=false;$('status').textContent='مقدرتش أحمل الكراسي، حدّث الصفحة';});
}
function render(){
 drawWho();renderAdmin();
 const p=persons().find(x=>x.id===$('who').value)||persons()[0],tabs=$('tabs');tabs.innerHTML='';
 const bk=$('bk');bk.hidden=!S.mine.length;bk.innerHTML='<label>حجوزاتك</label>';
 S.mine.forEach(v=>{const d=document.createElement('div');d.className='bk';const q=rangeOf(v),c=q[1]-q[0]+1;
  d.innerHTML='<span>✅ '+esc(v.name)+(c>1?' + '+(c-1)+' مرافق':'')+' · اتوبيس '+v.bus+' · كراسي '+esc(v.seats)+'</span>';
  const x=document.createElement('button');x.className='b';x.textContent='إلغاء';x.onclick=()=>cancelP(v.id);d.appendChild(x);bk.appendChild(d);});
 $('mapcard').hidden=true;
 if(!p.dept){say('اكتب اسمك واختاره من القايمة الأول عشان تشوف الاتوبيسات');return;}
 occ(p.dept);
 const list=allowed(p.dept);
 if(!list.includes(S.bus))S.bus=list[0];
 watchBus(S.bus);
 list.forEach(b=>{
  const t=document.createElement('button');t.className='tab'+(b===S.bus?' on':'');
  t.innerHTML='اتوبيس '+b+'<small>'+role(b,p.dept)+' · '+(MAJ[b]?'أغلبيته '+MAJ[b]:'مشكل')+'</small>';
  t.onclick=()=>{S.bus=b;render();};tabs.appendChild(t);
 });
 $('mapcard').hidden=false;
 $('hd').textContent=MAJ[S.bus]?'اتوبيس '+S.bus+' · أغلبيته '+MAJ[S.bus]+' ('+QUOTA[S.bus][MAJ[S.bus]]+' من '+CAP+' كرسي = '+CFG.P+'%) والباقي لأقسام تانية':'اتوبيس '+S.bus+' · مشكل لكل الأقسام';
 const bus=$('bus');bus.innerHTML='<div class="front">🧑‍✈️ السواق · مقدمة الاتوبيس</div>';
 let n=1;
 while(n<=CAP){
  const r=document.createElement('div');r.className='r';
  const row=(CAP-n+1===5)?[0,1,2,3,4]:[0,1,'a',2,3];
  for(const k of row){
   if(k==='a'){const a=document.createElement('div');a.className='aisle';r.appendChild(a);continue;}
   if(n>CAP)break;
   const num=n++,s=S.seats[num],z=zone(S.bus,num);
   const btn=document.createElement('button');btn.className='s';btn.textContent=num;
   if(z!==p.dept){btn.classList.add('z');btn.title='مخصص لـ'+z;btn.onclick=()=>say('الكرسي ده مخصص لـ'+z,true);}
   else{
    if(s){btn.classList.add(s.owner===S.uid?'m':'t');btn.title=s.owner===S.uid?s.name:'محجوز';}
    const bb=S.bus;btn.onclick=()=>onSeat(bb,num);
   }
   r.appendChild(btn);
  }
  bus.appendChild(r);
 }
 const taken=Object.values(S.seats).filter(v=>v.dept===p.dept).length;
 $('sum').textContent='كراسي قسمك في الاتوبيس ده: '+taken+' من '+(QUOTA[S.bus][p.dept]||0);
}
function findWin(b,n,k,d){
 for(let st=n;st>n-k;st--){
  if(st<1||st+k-1>CAP)continue;let ok=true;
  for(let i=0;i<k;i++){const q=st+i;if(zone(b,q)!==d||S.seats[q]){ok=false;break;}}
  if(ok)return st;
 }
 return null;
}

// ---------- الحجز والإلغاء (Transactions: آمنة مع الزحمة) ----------
async function retry(fn){
 for(let i=0;;i++){
  try{return await fn();}
  catch(e){
   const m=e&&e.message,c=e&&e.code;
   if(m==='name'||m==='taken'||m==='denied')throw e;
   if(i>=5)throw e;
   await new Promise(r=>setTimeout(r,150+Math.random()*350*(i+1)));
  }
 }
}
async function onSeat(b,n){
 if(S.busy)return;
 if(!S.uid){say('استنى ثانية، بيتم الاتصال...',true);return;}
 const s=S.seats[n];
 if(s){
  if(s.owner===S.uid||S.admin){if(confirm('إلغاء حجز '+s.name+'؟'))return cancelP(s.pn);}
  say('الكرسي ده محجوز',true);return;
 }
 const p=persons().find(x=>x.id===$('who').value);
 if(!p||!p.name||!p.dept){say('اكتب الاسم واختاره من قايمة المسجلين الأول',true);return;}
 if(zone(b,n)!==p.dept){say('الكرسي ده مخصص لـ'+zone(b,n),true);return;}
 if(p.kind==='friend'&&S.mine.filter(v=>v.kind==='friend').length>=3){say('الحد الأقصى 3 أصدقاء',true);return;}
 const nid=NID(p.name),k=1+p.comp,st=findWin(b,n,k,p.dept);
 if(st===null){say('مفيش '+k+' كراسي ورا بعض فاضيين جنب الكرسي ده، جرب مكان تاني',true);return;}
 const ownerName=(lookup($('nm').value)||{name:p.name}).name;
 S.busy=true;say('جاري الحجز...');
 try{
  await retry(()=>runTransaction(db,async tx=>{
   const bref=doc(db,'buses','b'+b),pref=doc(db,'people',nid);
   const bs=await tx.get(bref),ps=await tx.get(pref);
   if(ps.exists())throw new Error('name');
   const seats=(bs.exists()&&bs.data().seats)||{},add={};
   for(let i=0;i<k;i++){if(seats[st+i])throw new Error('taken');add[st+i]={owner:S.uid,pn:nid,name:i?p.name+' (مرافق)':p.name,dept:p.dept,ts:Date.now()};}
   tx.set(bref,{seats:add},{merge:true});
   tx.set(pref,{name:p.name,dept:p.dept,owner:S.uid,ownerName:ownerName,kind:p.kind==='me'?'me':'friend',bus:b,seats:k>1?st+'-'+(st+k-1):''+st,k:k,ts:Date.now()});
  }));
  delete S.pc[nid];say('');showOk(p,b,st,k);await loadMine();
 }catch(e){
  const m=e&&e.message;
  say(m==='name'?'الاسم ده اتحجز قبلك':m==='taken'?'الكرسي اتحجز قبلك بثانية، جرب كرسي تاني':'الزحمة كبيرة دلوقتي، حاول تاني',true);
 }finally{S.busy=false;}
}
async function cancelP(nid){
 if(S.busy)return;S.busy=true;
 try{
  await retry(()=>runTransaction(db,async tx=>{
   const pref=doc(db,'people',nid),ps=await tx.get(pref);
   if(!ps.exists())return;
   const v=ps.data();if(v.owner!==S.uid&&!S.admin)throw new Error('denied');
   const bref=doc(db,'buses','b'+v.bus),bs=await tx.get(bref),q=rangeOf(v);
   if(bs.exists()){const u={};for(let i=q[0];i<=q[1];i++)u['seats.'+i]=deleteField();tx.update(bref,u);}
   tx.delete(pref);
  }));
  delete S.pc[nid];say('تم الإلغاء');await loadMine();
 }catch(e){say('مقدرتش ألغي، حاول تاني',true);}
 finally{S.busy=false;}
}
function showOk(p,b,st,k){
 const el=$('ok');
 el.innerHTML='<div class="hd" style="color:var(--mine);font-size:16px">✅ تم الحجز</div><div style="font-size:15px;line-height:1.9">الاسم: <b>'+esc(p.name)+'</b><br>عدد الأشخاص: <b>'+k+'</b>'+(k>1?' (هو + '+(k-1)+' مرافق)':'')+'<br>الاتوبيس: <b>رقم '+b+'</b> · '+(MAJ[b]?'أغلبيته '+MAJ[b]:'مشكل لكل الأقسام')+'<br>الكراسي: <b>'+(k>1?st+' إلى '+(st+k-1):st)+'</b></div>';
 const x=document.createElement('button');x.className='b';x.textContent='تمام';x.style.marginTop='8px';x.onclick=()=>{el.hidden=true;};el.appendChild(x);
 el.hidden=false;el.scrollIntoView({behavior:'smooth',block:'center'});
}
async function loadMine(){
 if(!S.uid)return;
 try{const sn=await getDocs(query(collection(db,'people'),where('owner','==',S.uid)));S.mine=sn.docs.map(d=>Object.assign({id:d.id},d.data()));}catch(e){}
 render();
}

// ---------- الأدمن ----------
function renderAdmin(){
 const el=$('adm');$('cfgc').hidden=!S.admin;$('alog').hidden=!(location.hash==='#admin'&&!S.admin);
 if(!S.admin){el.hidden=true;return;}
 const cn=v=>{const q=rangeOf(v);return q[1]-q[0]+1;};
 const ppl=Object.entries(S.all).map(([id,v])=>Object.assign({id:id},v)).sort((a,b)=>a.bus-b.bus||parseInt(a.seats)-parseInt(b.seats));
 const tot=ppl.reduce((a,v)=>a+cn(v),0),byB={},byD={};
 ppl.forEach(v=>{(byB[v.bus]=byB[v.bus]||[]).push(v);byD[v.dept]=(byD[v.dept]||0)+cn(v);});
 const left=RI.filter(r=>!S.all[NID(r.name)]);
 let h='<div class="hd">لوحة الأدمن · '+ppl.length+' حجز · '+tot+' كرسي</div><div class="sum">'+DEPTS.map(d=>d+': '+(byD[d]||0)).join(' · ')+'</div>';
 for(let b=1;b<=Object.keys(QUOTA).length;b++){
  const l=byB[b]||[],n=l.reduce((a,v)=>a+cn(v),0);
  h+='<details><summary>اتوبيس '+b+' · '+n+' من '+CAP+'</summary>';
  l.forEach(v=>{const c=cn(v);h+='<div class="bk"><span>'+esc(v.name)+' · '+esc(v.dept)+(c>1?' + '+(c-1)+' مرافق':'')+(v.kind==='friend'?' · حجزله '+esc(v.ownerName):'')+'</span><span>كراسي '+esc(v.seats)+' <button class="b" data-c="'+esc(v.id)+'">إلغاء</button></span></div>';});
  h+='</details>';
 }
 h+='<details><summary>لسه ما حجزوش · '+left.length+'</summary>'+left.map(r=>'<div class="bk"><span>'+esc(r.name)+' · '+esc(r.dept)+'</span><span>'+(r.comp?r.comp+' مرافق':'')+'</span></div>').join('')+'</details>';
 el.innerHTML=h;el.hidden=false;
 el.querySelectorAll('button[data-c]').forEach(b=>{b.onclick=()=>{if(confirm('إلغاء الحجز ده؟'))cancelP(b.dataset.c);};});
}

// ---------- التشغيل ----------
function afterAuth(u){
 S.uid=u.uid;S.admin=!!u.email&&u.email===ADMIN_EMAIL;
 if(!S.started){
  S.started=true;
  $('status').hidden=true;$('form').hidden=false;
  onSnapshot(doc(db,'config','main'),sn=>{if(sn.exists()){const v=sn.data();buildConfig(v.N,v.C,v.P);}else buildConfig(6,49,70);fillCfg();render();});
 }
 if(S.admin&&!S.adminSub){S.adminSub=true;onSnapshot(collection(db,'people'),sn=>{const o={};sn.docs.forEach(d=>{o[d.id]=d.data();});S.all=o;renderAdmin();});}
 loadMine();
}
buildConfig(6,49,70);fillCfg();
attach($('nm'),$('sgm'),$('inm'),()=>{drawWho();render();});$('who').onchange=render;
$('addf').onclick=()=>{if(S.friends.length<3){S.friends.push({name:'',dept:''});drawFriends();render();}};
$('cA').onclick=async()=>{
 if(S.mine.length+Object.keys(S.all).length&&!confirm('فيه حجوزات موجودة، تغيير التوزيع ممكن يبوظها. متأكد؟'))return;
 try{await setDoc(doc(db,'config','main'),{N:+$('cN').value,C:+$('cC').value,P:+$('cP').value,ts:Date.now()});say('اتحفظت الإعدادات');}catch(e){say('مقدرتش أحفظ الإعدادات',true);}
};
$('ab').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('ae').value.trim(),$('ap').value);}catch(e){say('الإيميل أو الباسورد غلط',true);}};
window.addEventListener('hashchange',render);
render();
onAuthStateChanged(auth,async u=>{
 if(u){afterAuth(u);return;}
 try{await signInAnonymously(auth);}catch(e){$('status').hidden=false;$('status').textContent='مقدرتش أتصل. تأكد إن Anonymous متفعل في Firebase Authentication.';}
});
